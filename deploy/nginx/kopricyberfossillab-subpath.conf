# kopricyberfossillab 을 80 포트의 /kopricyberfossillab/ 아래에 얹는다 — **아직 깔지 않았다**(HANDOFF §0).
# Cropobite deploy/nginx/Cropobite-subpath.conf 의 꼴을 따랐다 — 사내 VPN 이 80 만 통과시키고, 80 은
# phyloserver 블록이 잡고 있어서 서브경로로 얹는다.
#
# 깔기 전에 사람이 정할 것: 세션 이름·프로젝트·도구 한 줄(파일 이름·명령 설명)이 사내망에 보이게 된다.
#
# 설치:
#   sudo cp deploy/nginx/kopricyberfossillab-subpath.conf /etc/nginx/snippets/
#   # /etc/nginx/sites-enabled/phyloserver 의 server 블록 안에 한 줄:
#   #     include snippets/kopricyberfossillab-subpath.conf;
#   sudo nginx -t && sudo systemctl reload nginx

location = /kopricyberfossillab {
    return 301 /kopricyberfossillab/;
}

location ^~ /kopricyberfossillab/ {
    # 끝의 슬래시 — nginx 가 /kopricyberfossillab/ 를 떼고 넘긴다. 화면은 상대경로만 쓴다(web/vite.config.ts base './')
    proxy_pass http://127.0.0.1:8098/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;

    # /api/events 는 SSE — 모아 두지 말고 바로 넘기고, 오래 연다
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
}
